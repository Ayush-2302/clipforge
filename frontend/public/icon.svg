<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#12162e" />
      <stop offset="100%" stop-color="#191338" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Forge Flame Left (Indigo -> Cyan) -->
    <linearGradient id="forgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Forge Flame Right (Violet -> Magenta) -->
    <linearGradient id="forgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="coreLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#cfBg)" stroke="url(#cfBorder)" stroke-width="20" />

  <!-- Ambient Radiant Core -->
  <circle cx="512" cy="512" r="320" fill="url(#centerGlow)" />

  <!-- ClipForge Modern Hex-Forge & Kinetic Play Symbol -->
  <g id="brand-symbol">
    <!-- Left Clip Wing (Geometric Precision Blade) -->
    <path d="M 330 270 
             C 410 270, 470 330, 470 410 
             L 470 614 
             C 470 694, 410 754, 330 754 
             C 270 754, 230 710, 230 650 
             L 230 374 
             C 230 314, 270 270, 330 270 Z" 
          fill="url(#forgeLeft)" />

    <!-- Right Cutting Wing (Dynamic Kinetic Forward Blade) -->
    <path d="M 694 754 
             C 614 754, 554 694, 554 614 
             L 554 410 
             C 554 330, 614 270, 694 270 
             C 754 270, 794 314, 794 374 
             L 794 650 
             C 794 710, 754 754, 694 754 Z" 
          fill="url(#forgeRight)" />

    <!-- Central Precision Diamond Forge & Play Trigger Core -->
    <!-- Crisp White Play Core with Soft Elevation -->
    <polygon points="430,340 670,512 430,684" fill="url(#coreLight)" filter="url(#glow)" />

    <!-- Micro AI Spark Node Top-Right -->
    <polygon points="730,220 740,250 770,260 740,270 730,300 720,270 690,260 720,250" fill="#ffffff" />
    <polygon points="290,720 298,744 322,752 298,760 290,784 282,760 258,752 282,744" fill="#38bdf8" />
  </g>
</svg>
